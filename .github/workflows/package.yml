name: Package Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: package-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  RUNTIME: win-x64
  PACKAGE_NAME: htmleditor-windows-installer

jobs:
  package:
    name: Build and publish installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore npm assets
        run: npm ci

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force

          $major = 1
          $minor = 0
          $latestPatch = -1

          $tags = git tag --list "$major.$minor.*"
          foreach ($tag in $tags) {
            if ($tag -match "^$major\.$minor\.(\d+)$") {
              $patch = [int]$Matches[1]
              if ($patch -gt $latestPatch) {
                $latestPatch = $patch
              }
            }
          }

          $nextPatch = $latestPatch + 1
          if ($nextPatch -lt 0) {
            $nextPatch = 0
          }

          $version = "$major.$minor.$nextPatch"
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER
          $tag = $version

          "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 `
            -Configuration $env:CONFIGURATION `
            -Runtime $env:RUNTIME `
            -Version "${{ steps.version.outputs.version }}" `
            -BuildNumber "${{ steps.version.outputs.build_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HtmlEditor-Setup-${{ steps.version.outputs.version }}-${{ env.RUNTIME }}
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Create release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $sha = "${{ github.sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ((git ls-remote --tags origin "refs/tags/$tag") -match "refs/tags/$tag") {
            throw "Release tag already exists: $tag"
          }

          git tag $tag $sha
          git push origin "refs/tags/$tag"

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath artifacts/installer -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not found in artifacts/installer."
          }

          $sha = "${{ github.sha }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $repository = "${{ github.repository }}"
          $releaseTitle = "HtmlEditor $version"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $releaseNotes = "Windows installer built from main.`n`nVersion: $version`nCommit: $sha`nRun: $runUrl"

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer.FullName `
              --repo $repository `
              --title $releaseTitle `
              --notes $releaseNotes
          }
          else {
            gh release edit $tag `
              --repo $repository `
              --title $releaseTitle `
              --notes $releaseNotes

            gh release upload $tag $installer.FullName `
              --repo $repository `
              --clobber
          }

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GitHub Container Registry
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:GITHUB_TOKEN | oras login ghcr.io `
            --username "${{ github.actor }}" `
            --password-stdin

      - name: Publish installer to GitHub Packages
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath artifacts/installer -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not found in artifacts/installer."
          }

          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $package = "${{ env.PACKAGE_NAME }}".ToLowerInvariant()
          $version = "${{ steps.version.outputs.version }}"
          $ref = "ghcr.io/$owner/${package}:$version"
          $installerLayer = "artifacts/installer/$($installer.Name):application/vnd.microsoft.portable-executable"

          oras push $ref `
            --artifact-type "application/vnd.htmleditor.windows.installer.v1" `
            $installerLayer `
            --annotation "org.opencontainers.image.title=HtmlEditor Windows Installer" `
            --annotation "org.opencontainers.image.description=HtmlEditor Windows installer built by GitHub Actions" `
            --annotation "org.opencontainers.image.version=$version" `
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}"

          $latestRef = "ghcr.io/$owner/${package}:latest"
          oras push $latestRef `
            --artifact-type "application/vnd.htmleditor.windows.installer.v1" `
            $installerLayer `
            --annotation "org.opencontainers.image.title=HtmlEditor Windows Installer" `
            --annotation "org.opencontainers.image.description=HtmlEditor Windows installer built by GitHub Actions" `
            --annotation "org.opencontainers.image.version=$version" `
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
